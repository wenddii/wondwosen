{% load static %}
<header class="site-header" id="siteHeader">
    <div class="header-container">
        <a href="/" class="brand-logo" aria-label="Wendwosen Tessema">
            <span class="brand-name">Wendwosen Tessema</span>
            <span class="brand-status-dot" title="Available for projects"></span>
        </a>

        <!-- Mobile Navigation Toggle -->
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- Navigation Links -->
        <nav class="site-nav" id="siteNav">
            <ul class="nav-list">
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#projects" class="nav-link">Projects</a></li>
                <li><a href="#experience" class="nav-link">Experience</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
                <li>
                    {% if profile.cv_file %}
                    <a href="{{ profile.cv_file.url }}" class="nav-link nav-cv" download target="_blank" rel="noopener">CV</a>
                    {% else %}
                    <a href="#contact" class="nav-link nav-cv" title="Request CV">CV</a>
                    {% endif %}
                </li>
            </ul>
        </nav>
    </div>
</header>
